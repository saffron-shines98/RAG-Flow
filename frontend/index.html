<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>TrackFlow</title>
<link rel="icon" href="data:,">
<style>
  :root{
    --grad: linear-gradient(135deg, #7B2FF7 0%, #E1306C 50%, #F77737 100%);
    --grad-soft: linear-gradient(135deg, rgba(123,47,247,0.10) 0%, rgba(225,48,108,0.10) 50%, rgba(247,119,55,0.10) 100%);
    --ink: #1c1626;
    --ink-soft: #6b6470;
    --hairline: #ece7ee;
    --bg: #fbfafc;
    --panel: #ffffff;
    --bubble-them: #f2eef4;
    --pink: #E1306C;
    --purple: #7B2FF7;
    --orange: #F77737;
    --green: #2ecc71;
    --radius-lg: 22px;
    --radius-md: 16px;
    --radius-pill: 999px;
  }

  *{ box-sizing: border-box; }
  html,body{ height:100%; }
  body{
    margin:0;
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Helvetica, Arial, sans-serif;
    background: var(--bg);
    color: var(--ink);
    -webkit-font-smoothing: antialiased;
  }

  .app{
    display:grid;
    grid-template-columns: 280px 1fr;
    height:100vh;
    max-width: 1240px;
    margin: 0 auto;
    background: var(--panel);
    box-shadow: 0 0 60px rgba(28,22,38,0.06);
  }

  /* ---------- Sidebar ---------- */
  .sidebar{
    border-right: 1px solid var(--hairline);
    padding: 24px 20px;
    display:flex;
    flex-direction:column;
    gap:20px;
    overflow-y:auto;
  }

  .brand{
    display:flex;
    align-items:center;
    gap:12px;
  }
  .brand-mark{
    width:42px; height:42px;
    border-radius:50%;
    padding:2px;
    background: var(--grad);
    display:flex; align-items:center; justify-content:center;
    flex-shrink:0;
  }
  .brand-mark span{
    width:100%; height:100%;
    border-radius:50%;
    background:#fff;
    display:flex; align-items:center; justify-content:center;
    font-weight:800; font-size:14px;
    color:var(--purple);
  }
  .brand-name{
    font-size:19px;
    font-weight:800;
    letter-spacing:-0.02em;
    line-height:1.1;
  }
  .brand-sub{
    font-size:12px;
    color:var(--ink-soft);
    margin-top:2px;
  }

  .btn-new{
    border:none;
    cursor:pointer;
    border-radius: var(--radius-pill);
    padding:12px 16px;
    font-size:14px;
    font-weight:700;
    color:#fff;
    background: var(--grad);
    display:flex;
    align-items:center;
    justify-content:center;
    gap:8px;
    transition: transform 0.15s ease, box-shadow 0.15s ease;
  }
  .btn-new:hover{ transform: translateY(-1px); box-shadow: 0 6px 16px rgba(225,48,108,0.28); }
  .btn-new:active{ transform: translateY(0); }

  .dropzone{
    border: 1.5px dashed #ddd4e6;
    border-radius: var(--radius-md);
    padding: 22px 14px;
    text-align:center;
    color: var(--ink-soft);
    font-size:13px;
    cursor:pointer;
    transition: border-color 0.15s ease, background 0.15s ease;
  }
  .dropzone:hover, .dropzone.drag{
    border-color: var(--pink);
    background: var(--grad-soft);
  }
  .dropzone .dz-icon{
    font-size:22px;
    margin-bottom:6px;
    display:block;
  }
  .dropzone input{ display:none; }

  .section-label{
    font-size:12px;
    font-weight:700;
    color: var(--ink-soft);
    padding: 4px 2px;
  }

  .attach-list{
    display:flex;
    flex-direction:column;
    gap:8px;
  }
  .attach-item{
    display:flex;
    align-items:center;
    gap:10px;
    padding:10px 12px;
    background: #f7f5f9;
    border-radius: var(--radius-md);
    font-size:13px;
    color: var(--ink);
  }
  .attach-item .file-dot{
    width:8px; height:8px;
    border-radius:50%;
    background: var(--grad);
    flex-shrink:0;
  }
  .attach-item .file-name{
    overflow:hidden;
    text-overflow:ellipsis;
    white-space:nowrap;
  }
  .attach-empty{
    font-size:13px;
    color: var(--ink-soft);
    padding: 6px 2px;
  }

  /* ---------- Main panel ---------- */
  .main{
    display:flex;
    flex-direction:column;
    height:100vh;
  }

  .topbar{
    display:flex;
    align-items:center;
    justify-content:space-between;
    padding: 18px 28px;
    border-bottom: 1px solid var(--hairline);
    flex-shrink:0;
  }

  .mode-toggle{
    position:relative;
    display:flex;
    background:#f2eef4;
    border-radius: var(--radius-pill);
    padding:4px;
    width:220px;
  }
  .mode-toggle button{
    flex:1;
    border:none;
    background:transparent;
    padding:9px 0;
    font-size:14px;
    font-weight:700;
    border-radius: var(--radius-pill);
    cursor:pointer;
    color: var(--ink-soft);
    position:relative;
    z-index:2;
    transition: color 0.2s ease;
  }
  .mode-toggle .glider{
    position:absolute;
    top:4px; left:4px;
    width: calc(50% - 4px);
    height: calc(100% - 8px);
    border-radius: var(--radius-pill);
    background: var(--grad);
    transition: transform 0.25s cubic-bezier(.4,0,.2,1);
    z-index:1;
  }
  .mode-toggle.mode-documents .glider{ transform: translateX(100%); }
  .mode-toggle button.active{ color:#fff; }

  .status{
    display:flex;
    align-items:center;
    gap:7px;
    font-size:13px;
    color: var(--ink-soft);
  }
  .status-dot{
    width:8px; height:8px;
    border-radius:50%;
    background: var(--green);
  }

  .thread{
    flex:1;
    overflow-y:auto;
    padding: 28px;
    display:flex;
    flex-direction:column;
    gap:18px;
  }

  .msg-row{
    display:flex;
    gap:10px;
    max-width:70%;
    animation: fadeIn 0.25s ease both;
  }
  .msg-row.mine{
    align-self:flex-end;
    flex-direction:row-reverse;
    max-width:65%;
  }
  @keyframes fadeIn{
    from{ opacity:0; transform: translateY(6px); }
    to{ opacity:1; transform: translateY(0); }
  }

  .avatar{
    width:34px; height:34px;
    border-radius:50%;
    padding:2px;
    background: var(--grad);
    flex-shrink:0;
    display:flex; align-items:center; justify-content:center;
  }
  .avatar span{
    width:100%; height:100%;
    border-radius:50%;
    background:#fff;
    display:flex; align-items:center; justify-content:center;
    font-size:12px;
    font-weight:800;
    color:var(--purple);
  }
  .msg-row.mine .avatar{ visibility:hidden; width:0; margin:0; }

  /* assistant: margin-annotation style, amber/left rule, no bubble fill */
  .bubble{
    padding: 13px 17px;
    border-radius: var(--radius-md);
    font-size:14.5px;
    line-height:1.5;
    background: var(--bubble-them);
    color: var(--ink);
  }
  .msg-row.mine .bubble{
    background: var(--grad);
    color:#fff;
    border-bottom-right-radius:4px;
  }
  .msg-row:not(.mine) .bubble{
    border-bottom-left-radius:4px;
  }

  .typing{
    display:flex;
    gap:4px;
    padding: 14px 17px;
    background: var(--bubble-them);
    border-radius: var(--radius-md);
    border-bottom-left-radius:4px;
    width:fit-content;
  }
  .typing span{
    width:6px; height:6px;
    border-radius:50%;
    background: var(--pink);
    animation: bounce 1.2s infinite ease-in-out;
  }
  .typing span:nth-child(2){ animation-delay:0.15s; background:var(--purple); }
  .typing span:nth-child(3){ animation-delay:0.3s; background:var(--orange); }
  @keyframes bounce{
    0%,60%,100%{ transform: translateY(0); opacity:0.5; }
    30%{ transform: translateY(-4px); opacity:1; }
  }

  .empty-state{
    margin:auto;
    text-align:center;
    color: var(--ink-soft);
    max-width:320px;
  }
  .empty-state .em-icon{
    width:56px; height:56px;
    border-radius:50%;
    background: var(--grad);
    margin: 0 auto 14px;
  }
  .empty-state h3{
    color: var(--ink);
    font-size:16px;
    margin:0 0 6px;
  }
  .empty-state p{
    font-size:13.5px;
    margin:0;
    line-height:1.5;
  }

  .composer{
    display:flex;
    align-items:center;
    gap:12px;
    padding: 18px 28px 22px;
    border-top: 1px solid var(--hairline);
    flex-shrink:0;
  }
  .composer input[type="text"]{
    flex:1;
    border: 1px solid var(--hairline);
    background: #f7f5f9;
    border-radius: var(--radius-pill);
    padding: 13px 18px;
    font-size:14.5px;
    color: var(--ink);
    outline:none;
    transition: border-color 0.15s ease, background 0.15s ease;
  }
  .composer input[type="text"]:focus{
    border-color: var(--pink);
    background:#fff;
  }
  .send-btn{
    width:44px; height:44px;
    border-radius:50%;
    border:none;
    background: var(--grad);
    color:#fff;
    display:flex; align-items:center; justify-content:center;
    cursor:pointer;
    flex-shrink:0;
    transition: transform 0.15s ease, opacity 0.15s ease;
  }
  .send-btn:hover{ transform: scale(1.05); }
  .send-btn:disabled{ opacity:0.5; cursor:default; transform:none; }
  .send-btn svg{ width:18px; height:18px; }

  .toast{
    position:fixed;
    bottom:24px;
    left:50%;
    transform: translateX(-50%) translateY(20px);
    background: var(--ink);
    color:#fff;
    padding:11px 20px;
    border-radius: var(--radius-pill);
    font-size:13px;
    opacity:0;
    pointer-events:none;
    transition: opacity 0.25s ease, transform 0.25s ease;
    z-index:50;
  }
  .toast.show{
    opacity:1;
    transform: translateX(-50%) translateY(0);
    pointer-events:auto;
  }

  ::-webkit-scrollbar{ width:8px; }
  ::-webkit-scrollbar-thumb{ background:#e5dfea; border-radius:8px; }
  ::-webkit-scrollbar-track{ background:transparent; }

  @media (max-width: 760px){
    .app{ grid-template-columns: 1fr; }
    .sidebar{ display:none; }
  }

  /* ---------- Rendered markdown inside assistant bubbles (NEW) ---------- */
  .bubble pre{
    background:#1e1e1e;
    padding:12px 14px;
    border-radius:10px;
    overflow-x:auto;
    margin:8px 0;
  }
  .copy-btn{
    position:absolute; top:8px; right:8px;
    background:#333; color:#ccc; border:none;
    padding:4px 10px; border-radius:6px;
    font-size:11px; cursor:pointer;
    opacity:0.7; transition:opacity 0.15s ease;
  }
  .copy-btn:hover{ opacity:1; }
  .bubble code{
    font-family: "Fira Code", Consolas, monospace;
    font-size:13px;
  }
  .bubble p code, .bubble li code{
    background:#eee3;
    padding:2px 5px;
    border-radius:4px;
  }
  .bubble ul, .bubble ol{
    margin:6px 0;
    padding-left:22px;
  }
  .bubble p{
    margin:0 0 8px;
  }
  .bubble p:last-child{
    margin-bottom:0;
  }
</style>

<!-- NEW: markdown parsing + sanitizing + code syntax highlighting -->
<script src="https://cdn.jsdelivr.net/npm/marked@4.3.0/marked.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/dompurify@3.0.6/dist/purify.min.js"></script>
<link rel="stylesheet" href="https://cdn.jsdelivr.net/gh/highlightjs/cdn-release@11.9.0/build/styles/github-dark.min.css">
<script src="https://cdn.jsdelivr.net/gh/highlightjs/cdn-release@11.9.0/build/highlight.min.js"></script>
</head>
<body>

<div class="app">

  <!-- Sidebar -->
  <aside class="sidebar">
    <div class="brand">
      <div class="brand-mark"><span>TF</span></div>
      <div>
        <div class="brand-name">TrackFlow</div>
        <div class="brand-sub">your document inbox</div>
      </div>
    </div>

    <button class="btn-new" id="newConvoBtn">+ New conversation</button>

    <label class="dropzone" id="dropzone">
      <span class="dz-icon">📎</span>
      Drop a file, or tap to browse
      <input type="file" id="fileInput" accept=".pdf,.docx,.txt,.png,.jpg,.jpeg" />
    </label>

    <div class="section-label">ATTACHED</div>
    <div class="attach-list" id="attachList">
      <div class="attach-empty">No documents yet in this chat.</div>
    </div>
  </aside>

  <!-- Main -->
  <main class="main">
    <div class="topbar">
      <div class="mode-toggle" id="modeToggle">
        <div class="glider"></div>
        <button class="active" data-mode="general">General</button>
        <button data-mode="documents">Documents</button>
      </div>
      <div class="status">
        <span class="status-dot"></span>
        Active now
      </div>
    </div>

    <div class="thread" id="thread">
      <div class="empty-state" id="emptyState">
        <div class="em-icon"></div>
        <h3>Hey! I'm TrackFlow</h3>
        <p>Upload a document or just ask me anything — I'll remember our conversation either way.</p>
      </div>
    </div>

    <div class="composer">
      <input type="text" id="messageInput" placeholder="Message TrackFlow..." autocomplete="off" />
      <button class="send-btn" id="sendBtn" aria-label="Send">
        <svg viewBox="0 0 24 24" fill="currentColor"><path d="M2 21l21-9L2 3v7l15 2-15 2z"/></svg>
      </button>
    </div>
  </main>

</div>

<div class="toast" id="toast"></div>

<script>
(function(){
  const API_BASE = ""; // same-origin: served from /ui, API at root

  const state = {
    sessionId: "session-" + Math.random().toString(36).slice(2, 10),
    mode: "general", // "general" | "documents"
    sending: false,
  };

  const els = {
    thread: document.getElementById("thread"),
    emptyState: document.getElementById("emptyState"),
    messageInput: document.getElementById("messageInput"),
    sendBtn: document.getElementById("sendBtn"),
    modeToggle: document.getElementById("modeToggle"),
    dropzone: document.getElementById("dropzone"),
    fileInput: document.getElementById("fileInput"),
    attachList: document.getElementById("attachList"),
    newConvoBtn: document.getElementById("newConvoBtn"),
    toast: document.getElementById("toast"),
  };

  function showToast(msg){
    els.toast.textContent = msg;
    els.toast.classList.add("show");
    setTimeout(() => els.toast.classList.remove("show"), 2600);
  }

  function clearEmptyState(){
    if (els.emptyState && els.emptyState.parentNode){
      els.emptyState.remove();
    }
  }

  function appendMessage(text, who){
    clearEmptyState();
    const row = document.createElement("div");
    row.className = "msg-row" + (who === "user" ? " mine" : "");

    const avatar = document.createElement("div");
    avatar.className = "avatar";
    avatar.innerHTML = `<span>${who === "user" ? "Y" : "TF"}</span>`;

    const bubble = document.createElement("div");
    bubble.className = "bubble";

    // --- NEW: render assistant markdown as HTML; keep user text as plain text ---
    if (who === "user") {
      bubble.textContent = text;
    } else if (typeof marked !== "undefined" && typeof DOMPurify !== "undefined") {
    const rawHtml = marked.parse(text);
    bubble.innerHTML = DOMPurify.sanitize(rawHtml);

    bubble.querySelectorAll("pre").forEach((preBlock) => {
      const codeBlock = preBlock.querySelector("code");
      if (codeBlock && typeof hljs !== "undefined") {
        hljs.highlightElement(codeBlock);
      }

      // NEW: copy button add karo
      const copyBtn = document.createElement("button");
      copyBtn.className = "copy-btn";
      copyBtn.textContent = "Copy";
      copyBtn.addEventListener("click", () => {
        navigator.clipboard.writeText(codeBlock ? codeBlock.textContent : preBlock.textContent);
        copyBtn.textContent = "Copied!";
        setTimeout(() => { copyBtn.textContent = "Copy"; }, 1500);
      });
      preBlock.style.position = "relative";
      preBlock.appendChild(copyBtn);
    });
  } else {
    // CDN load nahi hua (internet/ad-blocker issue) - fallback to plain text
    bubble.textContent = text;
  }
    // --- end NEW ---

    row.appendChild(avatar);
    row.appendChild(bubble);
    els.thread.appendChild(row);
    els.thread.scrollTop = els.thread.scrollHeight;
    return row;
  }

  function appendTyping(){
    clearEmptyState();
    const row = document.createElement("div");
    row.className = "msg-row typing-row";
    row.innerHTML = `
      <div class="avatar"><span>TF</span></div>
      <div class="typing"><span></span><span></span><span></span></div>
    `;
    els.thread.appendChild(row);
    els.thread.scrollTop = els.thread.scrollHeight;
    return row;
  }

  function setSending(isSending){
    state.sending = isSending;
    els.sendBtn.disabled = isSending;
  }

  // ---------- Mode toggle ----------
  els.modeToggle.addEventListener("click", (e) => {
    const btn = e.target.closest("button[data-mode]");
    if (!btn) return;
    state.mode = btn.dataset.mode;
    els.modeToggle.classList.toggle("mode-documents", state.mode === "documents");
    els.modeToggle.querySelectorAll("button").forEach(b => b.classList.toggle("active", b === btn));
    els.messageInput.placeholder = state.mode === "documents"
      ? "Ask about your documents..."
      : "Message TrackFlow...";
  });

  // ---------- New conversation ----------
  els.newConvoBtn.addEventListener("click", () => {
    state.sessionId = "session-" + Math.random().toString(36).slice(2, 10);
    els.thread.innerHTML = "";
    const empty = document.createElement("div");
    empty.className = "empty-state";
    empty.id = "emptyState";
    empty.innerHTML = `
      <div class="em-icon"></div>
      <h3>Hey! I'm TrackFlow</h3>
      <p>Upload a document or just ask me anything — I'll remember our conversation either way.</p>
    `;
    els.thread.appendChild(empty);
    els.emptyState = empty;
    renderAttachments([]);
    showToast("Started a new conversation");
  });

  // ---------- File upload ----------
  els.dropzone.addEventListener("dragover", (e) => {
    e.preventDefault();
    els.dropzone.classList.add("drag");
  });
  els.dropzone.addEventListener("dragleave", () => {
    els.dropzone.classList.remove("drag");
  });
  els.dropzone.addEventListener("drop", (e) => {
    e.preventDefault();
    els.dropzone.classList.remove("drag");
    const file = e.dataTransfer.files[0];
    if (file) uploadFile(file);
  });
  els.fileInput.addEventListener("change", (e) => {
    const file = e.target.files[0];
    if (file) uploadFile(file);
    els.fileInput.value = "";
  });

  async function uploadFile(file){
    const formData = new FormData();
    formData.append("file", file);
    formData.append("session_id", state.sessionId);

    showToast(`Uploading ${file.name}...`);
    try {
      const res = await fetch(`${API_BASE}/ingest`, {
        method: "POST",
        body: formData,
      });
      if (!res.ok) throw new Error(`Upload failed (${res.status})`);

      // Switch to Documents mode automatically
      state.mode = "documents";
      els.modeToggle.classList.add("mode-documents");
      els.modeToggle.querySelectorAll("button").forEach(b =>
        b.classList.toggle("active", b.dataset.mode === "documents")
      );
      els.messageInput.placeholder = "Ask about your documents...";

      showToast(`${file.name} uploaded`);
      await refreshAttachments();
    } catch (err) {
      console.error(err);
      showToast("Upload failed — check server/network");
    }
  }

  function renderAttachments(docs){
    if (!docs || docs.length === 0){
      els.attachList.innerHTML = `<div class="attach-empty">No documents yet in this chat.</div>`;
      return;
    }
    els.attachList.innerHTML = docs.map(name => `
      <div class="attach-item">
        <span class="file-dot"></span>
        <span class="file-name">${escapeHtml(name)}</span>
      </div>
    `).join("");
  }

  async function refreshAttachments(){
    try {
      const res = await fetch(`${API_BASE}/documents/session/${encodeURIComponent(state.sessionId)}`);
      if (!res.ok) return;
      const data = await res.json();
      renderAttachments(data.documents || []);
    } catch (err) {
      console.error("Could not refresh attachments", err);
    }
  }

  function escapeHtml(str){
    const div = document.createElement("div");
    div.textContent = str;
    return div.innerHTML;
  }

  // ---------- Send message ----------
  async function sendMessage(){
    const text = els.messageInput.value.trim();
    if (!text || state.sending) return;

    appendMessage(text, "user");
    els.messageInput.value = "";
    setSending(true);
    const typingRow = appendTyping();

    const endpoint = state.mode === "documents" ? "/ask" : "/chat";

    try {
      const res = await fetch(`${API_BASE}${endpoint}`, {
        method: "POST",
        headers: { "Content-Type": "application/json" },
        body: JSON.stringify({
          question: text,
          session_id: state.sessionId,
        }),
      });

      typingRow.remove();

      if (!res.ok){
        const errBody = await res.json().catch(() => ({}));
        throw new Error(errBody.detail || `Request failed (${res.status})`);
      }

      const data = await res.json();
      appendMessage(data.answer, "assistant");
    } catch (err) {
      console.error(err);
      typingRow.remove();
      appendMessage("Kuch gadbad ho gayi — dobara try karo.", "assistant");
      showToast(err.message || "Something went wrong");
    } finally {
      setSending(false);
      els.messageInput.focus();
    }
  }

  els.sendBtn.addEventListener("click", sendMessage);
  els.messageInput.addEventListener("keydown", (e) => {
    if (e.key === "Enter" && !e.shiftKey){
      e.preventDefault();
      sendMessage();
    }
  });

  // Initial attachments check (in case of reload with same session — no-op for fresh session)
  refreshAttachments();
})();
</script>

</body>
</html>
